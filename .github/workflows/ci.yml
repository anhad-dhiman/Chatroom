# Continuous integration: every push and pull request runs every test layer and builds the Docker image.
# Each job calls ./run-tests.sh, the same script developers run locally.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run that's already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write  # lets the JUnit report action annotate results

jobs:
  lint:
    name: Lint (shellcheck + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: bash run-tests.sh --lint

  backend:
    name: Backend tests (JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash run-tests.sh --backend
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Backend test results
          report_paths: reports/backend/*.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: reports/backend

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash run-tests.sh --frontend
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Frontend test results
          report_paths: reports/frontend/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: reports/frontend

  e2e:
    name: End-to-end tests (Selenium)
    # Only spend time on browser tests once the fast suites are green.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      # Google Chrome is preinstalled on GitHub's Ubuntu runners; Selenium Manager fetches the matching driver.
      - run: bash run-tests.sh --e2e
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: End-to-end test results
          report_paths: reports/e2e/junit.xml
      - name: Upload HTML report, failure screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            reports/e2e
            reports/server.log

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image and start app + PostgreSQL
        run: docker compose up --detach --build --wait --wait-timeout 240
      - name: Smoke test the running container
        run: |
          curl -fsS http://localhost:8080/actuator/health
          # Register a user against the real PostgreSQL database to prove the whole stack works.
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_smoke","password":"password123"}' | grep -q '"token"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
