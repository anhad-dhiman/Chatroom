server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: chatroom
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatroom}}
    username: ${DB_USER:chatroom}
    password: ${DB_PASSWORD:chatroom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Override in every real deployment with a long random value (>= 32 chars).
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration: ${JWT_EXPIRATION:PT168H}
  cors:
    # Comma-separated list. Only needed when the frontend is served from a different origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
